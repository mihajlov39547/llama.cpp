<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Better Facebook</title><link rel="stylesheet" href="popup.css"><script src="settings.js" defer></script><script src="popup.js" defer></script></head>
<body>
<header><img src="../icons/icon128.png" width="44" height="44" alt=""><div><h1>Better Facebook</h1><span id="version"></span></div></header>
<p class="tagline">A cleaner view of Facebook.</p>
<main>

<div class="features">
<div class="feature"><span class="feature-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M9 9v11"/></svg></span><div><h2>A more focused layout</h2><p>Cleaner profiles. Less clutter.</p></div></div>
<div class="feature"><span class="feature-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 7h4M17 12h4"/></svg></span><div><h2>Friends &amp; suggestions hidden</h2><p>More room for what matters to you.</p></div></div>
</div><p id="status" role="status" aria-live="polite" hidden></p>
</main><footer>Independent extension for Facebook.</footer>
</body></html>
