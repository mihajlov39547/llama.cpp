<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Prompt Enhancer — Options</title>
  <link rel="stylesheet" href="options.css">
  <script src="settings.js" defer></script>
  <script src="options.js" defer></script>
</head>
<body>
  <main>
    <h1>Local Prompt Enhancer</h1>
    <p>Improve your prompts with local AI.</p>
    <p>Prompts are sent only when you click Improve Prompt or Refine Further.</p>
    <form id="settings">
      <label>API base URL <input id="baseUrl" readonly></label>
      <p>The origin is fixed in this MVP. Other origins require a manifest permission change and URL validation changes.</p>
      <label>Temperature <input id="temperature" type="number" required></label>
      <label>Max output tokens <input id="maxTokens" type="number" required></label>
      <label>Timeout (seconds) <input id="timeout" type="number" required></label>
      <label>Maximum input characters <input id="maxInputLength" type="number" required></label>
      <button type="submit">Save settings</button>
      <button type="button" id="test">Test saved connection</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
